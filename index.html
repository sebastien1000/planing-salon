<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8a7b6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Planning Salon - Connexion</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="page-shell">
    <div class="phone login-shell">
      <section id="loginScreen" class="login">
        <div class="brand-wrap brandWrap login-brand">
          <div class="login-logo-wrapper">
            <img src="logo.png" alt="Logo salon" class="login-logo logo app-logo logoHero">
          </div>

          <div class="brand-text">
            <div class="brand">Planning<br>Salon</div>
            <div class="sub">Maquette mobile privee - onglerie et beaute</div>
          </div>
        </div>

        <div class="panel stack login-card">
          <div id="loginMsg" class="alert hidden"></div>

          <label for="loginUser">Identifiant</label>
          <input id="loginUser" class="field" autocomplete="username" placeholder="Identifiant">

          <label for="loginPass">Mot de passe</label>
          <input
            id="loginPass"
            class="field"
            type="password"
            autocomplete="current-password"
            placeholder="Mot de passe"
          >

          <button id="loginSubmit" class="primary login-submit" type="button">Connexion</button>
          <button id="forgotPassword" class="ghost ghost-link" type="button">Mot de passe oublie ?</button>

          <div class="login-demo-row">
            <button class="secondary grow" type="button" data-demo-user="Julie">Demo Julie</button>
            <button class="secondary grow" type="button" data-demo-user="Marion">Demo Marion</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="js/core/utils.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/auth.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
