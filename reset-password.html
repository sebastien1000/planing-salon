<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8a7b6">
  <title>Planning Salon - Nouveau mot de passe</title>
  <link rel="icon" type="image/png" href="assets/img/branding/favicon.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="page-shell">
    <div class="phone login-shell">
      <section class="login">
        <div class="brand-wrap brandWrap login-brand">
          <div class="login-logo-wrapper">
            <img src="assets/img/branding/logo.png" alt="Logo salon" class="login-logo logo logoHero">
          </div>
          <div class="brand-text">
            <div class="brand">Planning<br>Salon</div>
            <div class="sub">Nouveau mot de passe</div>
          </div>
        </div>

        <div id="checkingPanel" class="panel stack login-card">
          <p class="tiny">Verification du lien de reinitialisation...</p>
        </div>

        <div id="invalidPanel" class="panel stack login-card hidden">
          <div class="alert">Ce lien de reinitialisation est invalide ou a expire. Redemandez un lien depuis la page de connexion.</div>
          <a class="primary login-submit login-submit-link" href="index.html">Retour a la connexion</a>
        </div>

        <div id="resetPanel" class="panel stack login-card hidden">
          <div id="resetMsg" class="alert hidden"></div>

          <label for="newPassword">Nouveau mot de passe</label>
          <input id="newPassword" class="field" type="password" autocomplete="new-password" placeholder="Nouveau mot de passe">

          <label for="confirmPassword">Confirmer le mot de passe</label>
          <input id="confirmPassword" class="field" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe">

          <button id="resetSubmit" class="primary login-submit" type="button">Enregistrer le nouveau mot de passe</button>
        </div>

        <div id="donePanel" class="panel stack login-card hidden">
          <div class="success">Mot de passe mis a jour. Vous pouvez vous connecter.</div>
          <a class="primary login-submit login-submit-link" href="index.html">Aller a la connexion</a>
        </div>
      </section>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/supabase-client.js"></script>
  <script src="js/pages/reset-password.js"></script>
</body>
</html>
